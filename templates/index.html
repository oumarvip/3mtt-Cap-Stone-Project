<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crop Disease Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Smart farming assistant</p>
          <h1>Maize & Cassava Disease Detector</h1>
        </div>
      </header>

      <main class="container">
        <section class="panel upload-panel">
          <div class="field-group">
            <label for="crop">Crop type</label>
            <select id="crop">
              <option value="cassava">Cassava</option>
              <option value="maize">Maize</option>
            </select>
          </div>

          <div class="upload-options">
            <label class="upload-box" for="imageInput">
              <span class="upload-icon" aria-hidden="true">&#128193;</span>
              <strong>Upload an image</strong>
              <small>Choose a leaf photo from your device</small>
              <input id="imageInput" type="file" accept="image/*" />
            </label>

            <button class="upload-box camera-box" id="cameraBtn" type="button">
              <span class="upload-icon" aria-hidden="true">&#128247;</span>
              <strong>Use camera</strong>
              <small>Take a fresh photo of the leaf</small>
            </button>
            <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
          </div>

          <div class="preview-wrap" id="previewWrap" hidden>
            <img id="previewImage" alt="Selected leaf preview" />
          </div>

          <div class="actions">
            <button id="analyzeBtn" class="primary-btn" type="button" disabled>Analyze disease</button>
            <button id="resetBtn" class="secondary-btn" type="button">Reset</button>
          </div>
        </section>

        <section class="panel result-panel">
          <div id="statusBox" class="status-box idle">Waiting for image upload...</div>

          <div id="resultCard" class="result-card hidden">
            <div class="result-header">
              <span id="labelBadge" class="badge">Prediction</span>
              <span id="confidenceText" class="confidence">0%</span>
            </div>

            <div class="progress-bar">
              <div id="confidenceBar" class="progress-fill"></div>
            </div>

            <div class="result-body">
              <h2 id="displayName">Diagnosis</h2>
              <p id="recommendation">Recommendation will appear here.</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="cameraDialog" class="camera-dialog">
      <div class="camera-dialog-content">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">Camera</p>
            <h2>Take a leaf photo</h2>
          </div>
          <button id="closeCameraBtn" class="icon-btn" type="button" aria-label="Close camera">&times;</button>
        </div>
        <video id="cameraVideo" autoplay playsinline></video>
        <p id="cameraError" class="camera-error" hidden></p>
        <div class="dialog-actions">
          <button id="captureBtn" class="primary-btn" type="button">Capture photo</button>
          <button id="cancelCameraBtn" class="secondary-btn" type="button">Cancel</button>
        </div>
        <canvas id="cameraCanvas" hidden></canvas>
      </div>
    </dialog>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
